name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-validate:
    name: Build, test, and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup supported .NET SDKs and runtimes
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Display environment
        run: dotnet --info

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore maintained projects
        run: dotnet restore learn-dotnet.slnx --locked-mode --nologo

      - name: Verify formatting
        run: dotnet format whitespace learn-dotnet.slnx --verify-no-changes --no-restore --verbosity diagnostic

      - name: Build maintained projects
        run: dotnet build learn-dotnet.slnx --configuration Release --no-restore --nologo

      - name: Test maintained projects
        run: >-
          dotnet test learn-dotnet.slnx
          --configuration Release
          --no-build
          --nologo
          --logger "trx"
          --results-directory artifacts/test-results
          --collect "XPlat Code Coverage"

      - name: Validate article metadata
        shell: pwsh
        run: ./scripts/Test-ArticleMetadata.ps1

      - name: Validate Markdown links
        shell: pwsh
        run: ./scripts/Test-MarkdownLinks.ps1

      - name: Validate Markdown structure
        shell: pwsh
        run: ./scripts/Test-MarkdownQuality.ps1

      - name: Validate master solution inventory
        shell: pwsh
        run: ./scripts/Test-SolutionInventory.ps1

      - name: Audit NuGet vulnerabilities
        shell: pwsh
        run: ./scripts/Test-PackageVulnerabilities.ps1

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_attempt }}
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 14
