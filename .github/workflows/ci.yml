name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore solutions
        run: |
          dotnet restore DevForge/DevForge.slnx
          dotnet restore learn-dotnet-dsa/LearnDotNetDSA.slnx

      - name: Build solutions
        run: |
          dotnet build DevForge/DevForge.slnx --configuration Release --no-restore
          dotnet build learn-dotnet-dsa/LearnDotNetDSA.slnx --configuration Release --no-restore

      - name: Test solutions
        run: |
          dotnet test DevForge/DevForge.slnx --configuration Release --no-build
          dotnet test learn-dotnet-dsa/LearnDotNetDSA.slnx --configuration Release --no-build

      - name: Setup Node.js for markdown lint
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint markdown docs
        run: npx markdownlint-cli README.md COMMIT_MESSAGE_GUIDELINES.md GIT_GUIDELINES.md DevForge/README.md
