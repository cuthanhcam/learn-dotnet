name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore all solutions
        run: |
          find . -name "*.sln" -exec dotnet restore {} \;

      - name: Build all solutions
        run: |
          find . -name "*.sln" -exec dotnet build {} --configuration Release --no-restore \;

      - name: Test all solutions
        run: |
          find . -name "*.sln" -exec dotnet test {} --configuration Release --no-build --verbosity normal \;
