name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true

      - name: Restore
        run: dotnet restore 01-csharp-basics/01-csharp-basics.sln

      - name: Build
        run: dotnet build 01-csharp-basics/01-csharp-basics.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test 01-csharp-basics/01-csharp-basics.sln --configuration Release --no-build
