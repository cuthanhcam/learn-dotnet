name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore all solutions
        run: |
          find . -name "*.sln" -exec dotnet restore {} \;
          find . -name "*.slnx" -exec dotnet restore {} \;

      - name: Build solutions (exclude legacy)
        run: |
          find . -name "*.sln" \
            -not -path "./legacy/*" \
            -exec dotnet build {} --configuration Release --no-restore \;
          find . -name "*.slnx" \
            -not -path "./legacy/*" \
            -exec dotnet build {} --configuration Release --no-restore \;

      - name: Test all solutions
        run: |
          find . -name "*.sln" -exec dotnet test {} --configuration Release --no-build --verbosity normal \;
          find . -name "*.slnx" -exec dotnet test {} --configuration Release --no-build --verbosity normal \;
